<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tsa.photos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <input type="checkbox" id="toggle" class="input-toggler">   
    <label for="toggle" class="menu-toggler">
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
    </label>

    <aside class="sidebar">
        <ul class="menu">
            <li><a class="menu-link" href="/">Home</a></li>
            <li><a class="menu-link" href="/gallery.html">Images</a></li>
            <li><a class="menu-link" href="/about.html">About</a></li>
        </ul>
    </aside>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" style="text-decoration: none;">
                <svg width="32" height="32" viewBox="0 0 516.069 516.069" style="margin-right: 8px; vertical-align: middle;" fill="#000000">
                    <path d="M289.544,1.991l-74.577,129.132h267.532C446.312,65.22,373.904,11.416,289.544,1.991z M52.053,102.727l74.542,129.149L260.36,0.19C185.189-1.428,102.395,34.375,52.053,102.727z M20.544,358.77l149.118,0.018L35.896,127.102C-3.088,191.388-13.483,281.002,20.544,358.77z M226.525,514.077l74.577-129.132H33.571C69.757,450.849,142.166,504.652,226.525,514.077z M464.017,413.342l-74.542-129.149L255.709,515.878C330.88,517.496,413.675,481.693,464.017,413.342z M495.525,157.299l-149.118-0.018l133.766,231.686C519.157,324.681,529.553,235.066,495.525,157.299z"/>
                </svg>
            </a>
            <a href="/" class="logo">tsa.photos</a>
            <div class="header-spacer"></div>
        </div>
    </header>

    <main class="container" style="padding:80px 80px 24px; max-width: 1200px; margin: 0 auto;">
        <div style="display:flex; gap:0; align-items:flex-start; margin-bottom:40px" class="about-layout">
            <div style="flex: 2; padding-right: 20px;">
                <h1 style="font-size:2.5rem; font-weight:700; margin-bottom:20px;">About</h1>
                <p style="font-size:1.1rem; line-height:1.6; margin-bottom: 16px;">Landscapes, cities, cultures — captured on journeys through Japan and South America.</p>
                <p style="font-size:1.1rem; line-height:1.6; margin-bottom: 16px;">Countries visited: Japan, Argentina, Chile, Colombia, Peru and Bolivia.</p>
                <p style="font-size:1.1rem; line-height:1.6;">All images shot on Ricoh GR IIIX.</p>
                
                <!-- Social links (underneath text) -->
                <section class="social-links" aria-label="Social media" style="margin: 60px 0 0 -20px;">
                    <ul class="about-social">
                        <li>
                            <a href="https://www.facebook.com/tobiasskytteaaskov/" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
                                <i class="fa fa-facebook" aria-hidden="true"></i>
                                <span>Facebook</span>
                            </a>
                        </li>
                        <li>
                            <a href="https://www.instagram.com/tobias_skytte/" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
                                <i class="fa fa-instagram" aria-hidden="true"></i>
                                <span>Instagram</span>
                            </a>
                        </li>
                    </ul>
                </section>
            </div>
            <div style="flex: 1; display:flex; justify-content:center;">
                <!-- Portrait image -->
                <img id="portrait-img" src="/images/portrait.jpeg" alt="Portrait" style="width:100%; height:auto; border-radius:0; object-fit:cover; max-width:300px" />
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p style="text-align:center; width:100%; margin:0;">© <span id="year"></span> All rights reserved</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js" defer></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
      
      // Hamburger menu functionality
      const navMenuBtn = document.getElementById('nav-menu-btn');
      const navMenu = document.getElementById('nav-menu');
      
      if (navMenuBtn && navMenu) {
        navMenuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          navMenuBtn.classList.toggle('active');
          navMenu.classList.toggle('show');
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!navMenuBtn.contains(e.target) && !navMenu.contains(e.target)) {
            navMenuBtn.classList.remove('active');
            navMenu.classList.remove('show');
          }
        });
        
        // Close menu when clicking on a link
        navMenu.addEventListener('click', (e) => {
          if (e.target.tagName === 'A') {
            navMenuBtn.classList.remove('active');
            navMenu.classList.remove('show');
          }
        });
      }
      
      // Load portrait from database if available, with production fallback
      async function loadPortrait() {
        try {
          const response = await fetch('/api/photos');
          const images = await response.json();
          
          // Look for a portrait image (you can identify it by tags, description, or filename)
          const portrait = images.find(img => 
            img.tags && img.tags.includes('portrait') || 
            (img.description && img.description.toLowerCase().includes('portrait')) ||
            (img.filename && img.filename.toLowerCase().includes('portrait'))
          );
          
          if (portrait) {
            const img = document.getElementById('portrait-img');
            img.src = `/images/${portrait.country}/${portrait.filename}`;
            img.alt = portrait.location || 'Portrait';
            console.log('Loaded portrait from database:', portrait.filename);
          } else {
            console.log('No portrait found in database, using fallback');
            // Fallback is already set in HTML: /images/portrait.jpeg
          }
        } catch (error) {
          console.log('Error loading portrait from database, using fallback:', error);
          // Fallback portrait.jpeg will be used
        }
      }
      
      // Load portrait when page loads
      loadPortrait();
    </script>
</body>
</html>
