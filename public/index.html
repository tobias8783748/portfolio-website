<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tsa.photos</title>
    <meta name="description" content="Travel photography portfolio with landscapes, cities, and cultures." />
    <link rel="icon" type="image/svg+xml" href="/images/camera.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="front-page">
    <input type="checkbox" id="toggle" class="input-toggler">   
    <label for="toggle" class="menu-toggler">
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
    </label>

    <aside class="sidebar">
        <ul class="menu">
            <li><a class="menu-link" href="/">Home</a></li>
            <li><a class="menu-link" href="/gallery.html">Images</a></li>
            <li><a class="menu-link" href="/about.html">About</a></li>
        </ul>
    </aside>

    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">tsa.photos</a>
        </div>
    </header>

    <main class="container" style="padding:0; max-width:none; width:100%;">
        <!-- Sliding Gallery Section -->
        <section class="sliding-gallery-section">
            <div class="sliding-gallery-container">
                <div class="sliding-gallery" id="sliding-gallery">
                    <!-- Images will be dynamically loaded here -->
                </div>
            </div>
        </section>

        <!-- Full Gallery Section - Hidden on front page -->
        <section class="full-gallery-section" style="margin-top: 60px; display: none;">
            <div id="country-filters" class="filterbar">
                <button class="filter-link" data-country="all">All</button>
                <button class="filter-link active" data-tag="favorites" aria-current="true">Favorites</button>
                <button class="filter-link" data-tag="best" style="display:none;">Best</button>
            <button class="filter-link" data-country="Argentina">Argentina</button>
            <button class="filter-link" data-country="Bolivia">Bolivia</button>
            <button class="filter-link" data-country="Chile">Chile</button>
            <button class="filter-link" data-country="Colombia">Colombia</button>
            <button class="filter-link" data-country="Denmark">Denmark</button>
            <div class="dropdown">
                <button class="filter-link dropdown-toggle" data-country="Japan">Japan</button>
                <div class="dropdown-menu">
                    <button class="dropdown-item" data-country="Japan" data-region="Hokkaido">Hokkaido</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Honshu">Honshu</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Shikoku">Shikoku</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Okinawa">Okinawa</button>
                </div>
            </div>
            <button class="filter-link" data-country="Peru">Peru</button>
        </div>
        <div id="gallery-grid" class="masonry"></div>
        <div id="image-counter"></div>
        </section>
    </main>

    <div id="lightbox" style="position:fixed; inset:0; display:none; background:#ffffff; align-items:center; justify-content:center; z-index:1100; padding:10px;">
        <button id="lightbox-close" aria-label="Close" style="position:absolute; top:20px; right:20px; background:transparent; border:none; padding:0; opacity:1; z-index:1102; transition:all 0.2s ease; cursor:pointer; width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
            <svg fill="#000000" width="48" height="48" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20,2H4C2.9,2,2,2.9,2,4v16c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V4C22,2.9,21.1,2,20,2z M16.9,15.6L15.5,17l-3.5-3.5L8.4,17L7,15.6l3.5-3.5L7,8.5l1.4-1.4l3.5,3.5l3.5-3.5l1.4,1.4L13.4,12L16.9,15.6z"/>
            </svg>
        </button>
        <button id="lightbox-prev" aria-label="Previous" style="position:absolute; left:20px; top:50%; transform:translateY(-50%); background:transparent; border:none; padding:0; opacity:0.9; z-index:1101; transition:all 0.2s ease; cursor:pointer; width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
            <svg width="48" height="48" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M442,985 L418,985 C415.791,985 414,986.791 414,989 L414,1013 C414,1015.21 415.791,1017 418,1017 L442,1017 C444.209,1017 446,1015.21 446,1013 L446,989 C446,986.791 444.209,985 442,985 L442,985 Z M436,1002 L425.414,1002 L429.535,1006.12 C429.926,1006.51 429.926,1007.15 429.535,1007.54 C429.145,1007.93 428.512,1007.93 428.121,1007.54 L422.465,1001.879 C422.225,1001.639 422.15,1001.311 422.205,1001 C422.15,1000.689 422.225,1000.361 422.465,1000.121 L428.121,994.465 C428.512,994.074 429.145,994.074 429.535,994.465 C429.926,994.855 429.926,995.488 429.535,995.879 L425.414,1000 L436,1000 C436.553,1000 437,1000.448 437,1001 C437,1001.553 436.553,1002 436,1002 L436,1002 Z" transform="translate(-414, -985)" fill="#000000"/>
            </svg>
        </button>
        <div style="display:flex; flex-direction:column; align-items:center; max-width:90%; max-height:90%;">
            <div class="lightbox-image-container">
                <img id="lightbox-img" alt="" class="lightbox-image-3d" style="max-width:100%; max-height:80vh; width:auto; height:auto; border-radius:0; object-fit:contain; margin:0 auto;" />
            </div>
            <div id="lightbox-metadata" style="margin-top:20px; text-align:center; max-width:600px; padding:0 20px;">
                <div id="lightbox-location" style="font-size:14px; font-weight:600; margin-bottom:8px; color:#111;"></div>
                <div id="lightbox-description" style="font-size:14px; color:#333; margin-bottom:8px; font-style:italic;"></div>
                <div id="lightbox-details" style="font-size:14px; color:#666; margin-bottom:8px;"></div>
                <div id="lightbox-tags" style="font-size:14px; color:#888;"></div>
            </div>
        </div>
        <button id="lightbox-next" aria-label="Next" style="position:absolute; right:20px; top:50%; transform:translateY(-50%); background:transparent; border:none; padding:0; opacity:0.9; z-index:1101; transition:all 0.2s ease; cursor:pointer; width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
            <svg width="48" height="48" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M494,985 L470,985 C467.791,985 466,986.791 466,989 L466,1013 C466,1015.21 467.791,1017 470,1017 L494,1017 C496.209,1017 498,1015.21 498,1013 L498,989 C498,986.791 496.209,985 494,985 L494,985 Z M489.535,1001.879 L483.879,1007.54 C483.488,1007.93 482.855,1007.93 482.465,1007.54 C482.074,1007.14 482.074,1006.51 482.465,1006.12 L486.586,1002 L476,1002 C475.447,1002 475,1001.552 475,1001 C475,1000.447 475.447,1000 476,1000 L486.586,1000 L482.465,995.879 C482.074,995.488 482.074,994.854 482.465,994.465 C482.855,994.074 483.488,994.074 483.879,994.465 L489.535,1000.121 C489.775,1000.361 489.85,1000.689 489.795,1001 C489.85,1001.311 489.775,1001.639 489.535,1001.879 L489.535,1001.879 Z" transform="translate(-466, -985)" fill="#000000"/>
            </svg>
        </button>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p style="text-align:center; width:100%; margin:0;">© <span id="year"></span> All rights reserved</p>
        </div>
    </footer>

    <script src="/js/header-scroll.js" defer></script>
    <script src="/js/lightbox-3d.js" defer></script>
    <script src="/js/sliding-gallery.js" defer></script>
    <script src="/js/gallery.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js" defer></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
      
    </script>
</body>
</html>
