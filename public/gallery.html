<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tsa.photos</title>
    <link rel="icon" type="image/svg+xml" href="/images/camera.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover.css">
    <link rel="stylesheet" href="/css/styles.css" />

</head>
<body>
    <input type="checkbox" id="toggle" class="input-toggler">   
    <label for="toggle" class="menu-toggler">
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
        <span class="menu-toggler-line"></span>
    </label>

    <aside class="sidebar">
        <ul class="menu">
            <li><a class="menu-link" href="/">Home</a></li>
            <li><a class="menu-link" href="/gallery.html">Images</a></li>
            <li><a class="menu-link" href="/about.html">About</a></li>
        </ul>
    </aside>

    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">tsa.photos</a>
        </div>
    </header>

    <main class="container" style="padding:32px 0 24px; max-width:none; width:100%;">
        <div id="country-filters" class="filterbar">
                <button class="filter-link" data-country="all">All</button>
                <button class="filter-link active" data-tag="favorites" aria-current="true">Favorites</button>
            <button class="filter-link" data-tag="best" style="display:none;">Best</button>
            <button class="filter-link" data-country="Argentina">Argentina</button>
            <button class="filter-link" data-country="Bolivia">Bolivia</button>
            <button class="filter-link" data-country="Chile">Chile</button>
            <button class="filter-link" data-country="Colombia">Colombia</button>
            <button class="filter-link" data-country="Denmark">Denmark</button>
            <div class="dropdown">
                <button class="filter-link dropdown-toggle" data-country="Japan">Japan</button>
                <div class="dropdown-menu">
                    <button class="dropdown-item" data-country="Japan" data-region="Hokkaido">Hokkaido</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Honshu">Honshu</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Shikoku">Shikoku</button>
                    <button class="dropdown-item" data-country="Japan" data-region="Okinawa">Okinawa</button>
                </div>
            </div>
            <button class="filter-link" data-country="Peru">Peru</button>
        </div>
        <div id="gallery-grid" class="masonry"></div>
        <div id="image-counter"></div>
    </main>

    <div id="lightbox" style="position:fixed; inset:0; display:none; background:#ffffff; align-items:center; justify-content:center; z-index:1100; padding:20px;">
        <button id="lightbox-close" aria-label="Close" style="position:absolute; top:20px; right:20px; background:transparent; border:none; padding:0; opacity:1; z-index:1102; transition:all 0.2s ease; cursor:pointer;">
            <img src="/images/close-square-filled-svgrepo-com.svg" alt="Close" style="width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
        </button>
        <button id="lightbox-prev" aria-label="Previous" style="position:absolute; left:20px; top:50%; transform:translateY(-50%); background:transparent; border:none; padding:0; opacity:0.9; z-index:1101; transition:all 0.2s ease; cursor:pointer;">
            <img src="/images/arrow-left-square-svgrepo-com.svg" alt="Previous" style="width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
        </button>
        <div style="display:flex; flex-direction:column; align-items:center; max-width:90%; max-height:90%;">
            <div class="lightbox-image-container">
                <img id="lightbox-img" alt="" class="lightbox-image-3d" style="max-width:100%; max-height:80vh; width:auto; height:auto; border-radius:0; object-fit:contain; margin:0 auto;" />
            </div>
            <div id="lightbox-metadata" style="margin-top:20px; text-align:center; max-width:600px; padding:0 20px;">
                <div id="lightbox-location" style="font-size:14px; font-weight:600; margin-bottom:8px; color:#111;"></div>
                <div id="lightbox-description" style="font-size:14px; color:#333; margin-bottom:8px; font-style:italic;"></div>
                <div id="lightbox-details" style="font-size:14px; color:#666; margin-bottom:8px;"></div>
                <div id="lightbox-tags" style="font-size:14px; color:#888;"></div>
            </div>
        </div>
        <button id="lightbox-next" aria-label="Next" style="position:absolute; right:20px; top:50%; transform:translateY(-50%); background:transparent; border:none; padding:0; opacity:0.9; z-index:1101; transition:all 0.2s ease; cursor:pointer;">
            <img src="/images/arrow-right-square-svgrepo-com-2.svg" alt="Next" style="width:48px; height:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
        </button>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p style="text-align:center; width:100%; margin:0;">© <span id="year"></span> All rights reserved</p>
        </div>
    </footer>

    <script src="/js/header-scroll.js" defer></script>
    <script src="/js/lightbox-3d.js" defer></script>
    <script src="/js/gallery.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js" defer></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
